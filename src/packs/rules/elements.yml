_id: element000000000
_key: "!journal!element000000000"
flags:
  core:
    locked: true
    viewMode: 2
  teriock:
    ruleIcon: ms-triangle-circle
    ruleType: element
name: Elements
pages:
  - _id: flame00000000000
    _key: "!journal.pages!element000000000.flame00000000000"
    name: Flame
    system:
      img: systems/teriock/src/assets/thumbnails/element/flame.webp
      slug: flame
    text:
      content: >-
        <p><b>Flame</b> magic is loud, dynamic, and explosive in character. It is the element of raw emotion, energy,
        and creative expression. It can be violent, chaotic, and destructive. But it can also be insightful,
        explorative, and ambitious. Where some find it messy and one-dimensional, others see a rich tapestry of
        warmth.</p>
    type: rule
  - _id: life000000000000
    _key: "!journal.pages!element000000000.life000000000000"
    name: Life
    system:
      img: systems/teriock/src/assets/thumbnails/element/life.webp
      slug: life
    text:
      content: >-
        <p><b>Life</b> magic is bright, structured, and often generous. It is emblematic of pride,
        @Identifier[source:divine]{faith}, and second chances. It can be restorative, caring, and honest. But it can
        also be hierarchical, perfectionist, and orderly. More-so than any other form of magic, life is about being a
        piece of something greater.</p>
    type: rule
  - _id: celestial0000000
    _key: "!journal.pages!element000000000.celestial0000000"
    name: Celestial
    system:
      img: systems/teriock/src/assets/thumbnails/element/celestial.webp
      slug: celestial
    text:
      content: >-
        <p><b>Celestial</b> magic is somewhat indistinct. It is the baseline canvas that other
        @UUID[Compendium.teriock.rules.JournalEntry.element000000000]{elements} decorate. Whenever magic is lacking the
        character of any other @UUID[Compendium.teriock.rules.JournalEntry.element000000000]{element}, it is
        celestial.</p>
    type: rule
  - _id: storm00000000000
    _key: "!journal.pages!element000000000.storm00000000000"
    name: Storm
    system:
      img: systems/teriock/src/assets/thumbnails/element/storm.webp
      slug: storm
    text:
      content: >-
        <p><b>Storm</b> is calculating, controlling, and deeply intellectual. It knows the rules by which systems
        operate and the emotions that make people tick. It is often cold, rigid, and prone to obsession. Nevertheless,
        its scope is as vast as the time it seeks to comprehend.</p>
    type: rule
  - _id: nature0000000000
    _key: "!journal.pages!element000000000.nature0000000000"
    name: Nature
    system:
      img: systems/teriock/src/assets/thumbnails/element/nature.webp
      slug: nature
    text:
      content: >-
        <p><b>Nature</b> magic is deep, interconnected, and very sturdy. It is not as passionate as
        @Identifier[element:flame]{flame} nor as intellectual as @Identifier[element:storm]{storm}. Nevertheless, it
        contains empathy and understanding at an intuitive and fundamental level. It is adaptable, organic, social, and
        explorative. More-so than any other @UUID[Compendium.teriock.rules.JournalEntry.element000000000]{element},
        nature is self-reflective, cyclical, and always evolving.</p>
    type: rule
  - _id: necromancy000000
    _key: "!journal.pages!element000000000.necromancy000000"
    name: Necromancy
    system:
      img: systems/teriock/src/assets/thumbnails/element/necromancy.webp
      slug: necromancy
    text:
      content: >-
        <p>As the element of @Identifier[condition:dead]{death}, <b>necromancy</b> is often feared for its uncertainty
        and finality. But within the view of necromancy, the end is just the start of a new chapter. Necromancy finds
        value in the forgotten, the downtrodden, the sick, and the deceased. Much as a bog can be rotten and decaying
        but still filled with life, necromancy can be cruel and manipulative, but nevertheless helpful in unintuitive
        ways. It can be self-centered, but also self-sacrificing and aware of its flaws.</p>
    type: rule
