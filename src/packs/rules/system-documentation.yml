        Status</p></td><td><p>[[code status]]</p></td><td><p>[[code
        /apply]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /repair]]</p></td><td><p>Repair</p></td><td><p></p></td><td><p>[[code
        /shatter]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /reset]]</p></td><td><p>Reset</p></td><td><p></p></td><td><p></p></td><td><p></p></td></tr><tr><td><p>[[code
        /resist]]</p></td><td><p>Roll Resistance</p></td><td><p>[[code type]]</p></td><td><p>[[code
        /resist]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /revitalize]]</p></td><td><p>Revitalize</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /revitalizing]]</p></td><td><p>Apply Revitalization</p></td><td><p>[[code formula]]</p></td><td><p>[[code
        /drain]]</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /revive]]</p></td><td><p>Revive</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /session-end]]</p></td><td><p>Session
        End</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /session-start]]</p></td><td><p>Session
        Start</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code /set-temp-hp]]<br>[[code
        /sth]]</p></td><td><p>Set Temporary HP</p></td><td><p>[[code formula]]</p></td><td><p>Undoes the
        command.</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code /set-temp-mp]]<br>[[code /stm]]</p></td><td><p>Set
        Temporary MP</p></td><td><p>[[code formula]]</p></td><td><p>Undoes the
        command.</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /shatter]]</p></td><td><p>Shatter</p></td><td><p></p></td><td><p>[[code
