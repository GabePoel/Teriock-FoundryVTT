  - _id: 3NyEbKMVFwMedG26
    _key: "!journal.pages!pIYm1KYBRZQdHajT.3NyEbKMVFwMedG26"
    name: Chat Commands
    text:
      content: >-
        <p>Commands show up in several contexts. The most straightforward of these is as chat messages by typing one
        into chat, such as [[code /damage take 5]]. They run on the actors of the selected tokens or on your own actor
        if no tokens are selected. Foundry's own commands, such as [[code /roll]], also work.</p><p>Commands can also be
        @UUID[Compendium.teriock.rules.JournalEntry.pIYm1KYBRZQdHajT.JournalEntryPage.t14xGhzsmr4mZ3Hn]{enriched} as
        buttons in text by wrapping them in double brackets, such as [[code [​[/damage 2d6]​]]] which makes [[/damage
        2d6]]. Buttons run on the actor of the document the text is in or on your own actor otherwise. Left-click a
        button to take its command. Right-click it to take the reverse command
        instead.</p><h2>Arguments</h2><p>Arguments are given in order and separated by spaces, such as [[code /hack leg
        2]]. Options can be added anywhere as [[code name=value]].</p><p>Numeric commands take a formula. Running one
        rolls the formula and makes a chat message with the result and any relevant buttons for taking it.
        Right-clicking a button for a numeric command also rolls the formula but toggles whether the roll dialog is
        shown. Starting the formula with [[code take]] takes the amount directly without rolling and [[code take]] on
        its own asks for the amount. Numeric commands can be added as automations to abilities or as things dealt by
        armaments.</p><h2>Commands</h2><table><tbody><tr><td><p><strong>Command</strong></p></td><td><p><strong>Name</strong></p></td><td><p><strong>Arguments</strong></p></td><td><p><strong>Reverse</strong></p></td><td><p><strong>Trigger</strong></p></td></tr><tr><td><p>[[code
        /apply]]</p></td><td><p>Apply Status</p></td><td><p>[[code status]]</p></td><td><p>[[code
        /remove]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /attack]]</p></td><td><p>Attack</p></td><td><p></p></td><td><p>[[code
        /attack]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /attune]]</p></td><td><p>Attune</p></td><td><p></p></td><td><p>[[code
        /deattune]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /awaken]]</p></td><td><p>Awaken</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /bag]]</p></td><td><p>Death Bag
        Pull</p></td><td><p></p></td><td><p></p></td><td><p></p></td></tr><tr><td><p>[[code
        /cover]]</p></td><td><p>Cover</p></td><td><p>[[code amount]]</p></td><td><p>[[code
        /uncover]]</p></td><td><p></p></td></tr><tr><td><p>[[code /damage]]<br>[[code /dmg]]</p></td><td><p>Take
        Damage</p></td><td><p>[[code formula]]</p></td><td><p>[[code
        /healing]]</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /dampen]]</p></td><td><p>Dampen</p></td><td><p></p></td><td><p>[[code
        /undampen]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /dawn]]</p></td><td><p>Dawn</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /deattune]]</p></td><td><p>Deattune</p></td><td><p></p></td><td><p>[[code
        /attune]]</p></td><td><p></p></td></tr><tr><td><p>[[code
        /destroy]]</p></td><td><p>Destroy</p></td><td><p></p></td><td><p>[[code
        /reforge]]</p></td><td><p></p></td></tr><tr><td><p>[[code /drain]]<br>[[code /drn]]</p></td><td><p>Take
        Drain</p></td><td><p>[[code formula]]</p></td><td><p>[[code
        /revitalizing]]</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /dusk]]</p></td><td><p>Dusk</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /earn]]</p></td><td><p>Earn Money</p></td><td><p>[[code formula]] [[code currencies=value]] [[code debt=value]]
        [[code equipment-types=value]] [[code mode=value]]</p></td><td><p>[[code
        /pay]]</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code /elder-sorcery]]<br>[[code /es]]</p></td><td><p>Create
        Elder Sorcery</p></td><td><p></p></td><td><p></p></td><td><p></p></td></tr><tr><td><p>[[code
        /fall]]</p></td><td><p>Fall</p></td><td><p>[[code
        distance]]</p></td><td><p></p></td><td><p></p></td></tr><tr><td><p>[[code /feat]]</p></td><td><p>Feat
        Save</p></td><td><p>[[code attribute]]</p></td><td><p>[[code
        /feat]]</p></td><td><p></p></td></tr><tr><td><p>[[code /gain-temp-hp]]<br>[[code /gth]]</p></td><td><p>Gain
