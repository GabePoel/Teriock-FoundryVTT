        command.</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code /read-magic]]</p></td><td><p>Read
        Magic</p></td><td><p></p></td><td><p></p></td><td><p></p></td></tr><tr><td><p>[[code
        /reforge]]</p></td><td><p>Reforge</p></td><td><p></p></td><td><p>[[code
