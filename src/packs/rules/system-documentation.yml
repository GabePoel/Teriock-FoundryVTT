        Temporary MP</p></td><td><p>[[code formula]]</p></td><td><p>Undoes the
        command.</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /glue]]</p></td><td><p>Glue</p></td><td><p></p></td><td><p>[[code
        /unglue]]</p></td><td><p></p></td></tr><tr><td><p>[[code /hack]]</p></td><td><p>Hack Arm</p></td><td><p>[[code
        part]] [[code amount]]</p></td><td><p>[[code /unhack]]</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /heal]]</p></td><td><p>Heal</p></td><td><p></p></td><td><p></p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
