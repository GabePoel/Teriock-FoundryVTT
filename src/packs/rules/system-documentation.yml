        part]] [[code amount]]</p></td><td><p>[[code /hack]]</p></td><td><p>Yes</p></td></tr><tr><td><p>[[code
        /use]]</p></td><td><p>Use Document</p></td><td><p>[[code key]]</p></td><td><p>[[code
        /use]]</p></td><td><p></p></td></tr><tr><td><p>[[code /wither]]</p></td><td><p>Take Wither</p></td><td><p>[[code
        formula]]</p></td><td><p>Undoes the command.</p></td><td><p>Yes</p></td></tr></tbody></table><p>Commands with a
        trigger fire a trigger of the same name on each actor before they are taken. Automations can respond to these
