_id: lore000000000000
_key: "!journal!lore000000000000"
flags:
  core:
    locked: true
    viewMode: 2
  teriock:
    ruleIcon: ms-newsstand
    ruleType: lore
name: Lore
pages:
  - _id: holidays00000000
    _key: "!journal.pages!lore000000000000.holidays00000000"
    name: Holidays
    system:
      identifier: holidays
      img: icons/magic/symbols/star-inverted-yellow.webp
    text:
      content: >-
        <p>Sometimes specific days of the year will be widely celebrated and have an additional meaning associated with
        it. These <b>holidays</b> often have additional effects that apply to everyone that partakes in them or just
        change something about the world at large. These effects typically @Identifier[source:divine]{divinely powered}
        @Wiki[Category:World effects]{world effects}.</p>
    type: rule
  - _id: saurageClans0000
    _key: "!journal.pages!lore000000000000.saurageClans0000"
    name: Saurage Clans
    system:
      identifier: saurage-clans
      img: icons/equipment/neck/necklace-animal-lizard.webp
    text:
      content: >-
        <p>There are eight main clans of @Identifier[creature:desert-saurage]{desert saurages} on the
        @Wiki[Category:Creatures from the mainland]{teriock mainland}. Each of them has a different distinct
        @Pack[teriock.abilities]{ability} that all members of the clan gain as well as a certain color and type of
        jewelry that denotes clan members.</p><p>@Embed[Compendium.teriock.tables.RollTable.5cabb085721fa30c
        caption=false rollable]</p>
    type: rule
  - _id: teiKobanClans000
    _key: "!journal.pages!lore000000000000.teiKobanClans000"
    name: Tei Koban Clans
    system:
      identifier: tei-koban-clans
      img: icons/environment/creatures/horse-tan.webp
    text:
      content: >-
        <p>The Tei Koban are a group of @Identifier[creature:cobben]{cobbens} from a group of islands connected to the
        Blue Reefs that practice ancestor worship and have a complex set of cultural traditions and dances that imbue
        the @Identifier[ability:spirit-item]{spirit items} with powers mastered by their ancestors. They have complex
        facial tattoos that represent which of the eight clans they are from.</p><p>Dancing is an integral part of Tei
        Koban culture. The dances prepare young @Identifier[creature:cobben]{cobbens} for obtaining their
        @Identifier[ability:spirit-item]{spirit items} and bolsters their ancestral connection and
        training.</p><p>@Embed[Compendium.teriock.tables.RollTable.111191792288f1c7 caption=false rollable]</p>
    type: rule
  - _id: overlays00000000
    _key: "!journal.pages!lore000000000000.overlays00000000"
    name: Overlays
    system:
      identifier: overlays
      img: icons/magic/symbols/runes-star-pentagon-blue.webp
    text:
      content: >-
        <p>An <b>overlay</b> is a massive field of @Identifier[core:hit-points-and-mana-points]{mana} that covers a
        large area and helps @Identifier[source:magical]{power} @Wiki[Category:Spells]{spells} and other
        @Identifier[source:magical]{magically powered abilities}. They may be created by a
        @Identifier[archetype:mage]{mage} school or other powerful entity. Overlays often have a substantial warping
        affect on the @Wiki[Category:Magical effects]{magical} and metaphysical ecosystem in which they operate and can
        alter the rules that casting operates under. They may be so strong as to constitute being a @Wiki[Category:World
        effects]{world effect}. The most common use of an overlay is for casters that have access to it to use its
        @Identifier[core:hit-points-and-mana-points]{MP} to help discount their
        @Wiki[Category:Spells]{spells}.</p><h2>ECHO</h2><p>@Embed[lore:eternal-compass-heightened-overlay description
        inline]</p>
    type: rule
  - _id: metaLassi0000000
    _key: "!journal.pages!lore000000000000.metaLassi0000000"
    flags:
      teriock:
        hiddenSubpage: true
    name: Meta Lassi
    system:
      identifier: meta-lassi
      img: icons/magic/air/wind-stream-purple-blue.webp
    text:
      content: >-
        <p>The <b>Meta Lassi</b> cuts through the Teriock continent. It maintains all the same rules as the Meta Tulta,
        but @Wiki[Category:Magical effects]{magical} @Wiki[Category:Revival effects]{revival effects} fail to the east
        of it.</p>
    type: rule
  - _id: meta000000000000
    _key: "!journal.pages!lore000000000000.meta000000000000"
    flags:
      teriock:
        hiddenSubpage: true
    name: Meta
    system:
      identifier: meta
      img: icons/magic/air/wind-stream-red.webp
    text:
      content: >-
        <p>Teriock's final meta is simply known as "the <b>Meta</b>". It maintains all the same rules as the Meta Tulta
        and Meta Lassi, but to the east of it, all @Wiki[Category:Magical effects]{magic} fails. That is, the
        @Identifier[source:magical]{magical power source} is not available. This includes most @Wiki[Category:Divine
        effects]{divine effects}, but the @Identifier[source:divine]{divine power source} still somewhat functions while
        @Identifier[condition:ethereal]{Ethereal} or in certain @Identifier[source:spiritual]{spiritually enhanced
        environments}.</p>
    type: rule
  - _id: eternalCompassHe
    _key: "!journal.pages!lore000000000000.eternalCompassHe"
    flags:
      teriock:
        hiddenSubpage: true
    name: Eternal Compass Heightened Overlay
    system:
      identifier: eternal-compass-heightened-overlay
      img: icons/magic/symbols/runes-star-blue.webp
    text:
      content: >-
        <p>In the Teriock game world, the <b>Eternal Compass Heightened Overlay</b> (or <b>ECHO</b>) is the main
        overlay. It is intimately connected with not only @Wiki[Category:Magical effects]{magical effects}, but
        @Wiki[Category:Primal effects]{primal} and @Wiki[Category:Divine effects]{divine} ones as well such as most
        @Identifier[lore:holidays]{holidays}. Unlike most overlays in <a target="_blank" rel="nofollow noreferrer
        noopener" class="external text" href="https://www.fanwar.com">Roekron</a> and other game worlds, ECHO is not
        thought to be created by any @Identifier[archetype:mage]{mage} school or other organization and is instead
        believed to be an a more intrinsic feature of the world.</p><p>Within ECHO, @Wiki[Category:Long range
        effects]{long range effects} fail over long distances. It is believed that this is due to an excess of
        @Identifier[source:magical]{magical energy} which acts as a solvent to such effects which dissipate them akin to
        salts being dissolved in water.</p>
    type: rule
  - _id: metas00000000000
    _key: "!journal.pages!lore000000000000.metas00000000000"
    name: Metas
    system:
      identifier: metas
      img: icons/magic/air/wind-stream-blue-gray.webp
    text:
      content: >-
        <p>A <b>meta</b> is a line that crosses the world over which the metaphysics that govern it suddenly change. In
        Teriock there are three known metas.</p><h2>Meta Tulta</h2><p>@Embed[lore:meta-tulta description
        inline]</p><h2>Meta Lassi</h2><p>@Embed[lore:meta-lassi description inline]</p><h2>Meta</h2><p>@Embed[lore:meta
        description inline]</p>
    type: rule
  - _id: metaTulta0000000
    _key: "!journal.pages!lore000000000000.metaTulta0000000"
    flags:
      teriock:
        hiddenSubpage: true
    name: Meta Tulta
    system:
      identifier: meta-tulta
      img: icons/magic/air/wind-stream-purple.webp
    text:
      content: >-
        <p>The <b>Meta Tulta</b> is one of the main dividing lines between <a target="_blank" rel="nofollow noreferrer
        noopener" class="external text" href="https://fanwar.com">Roekron</a> and Teriock. On the western side, the
        @Identifier[core:death-bag]{death bag} operates differently, often having different effects that are interwoven
        as part of it. On the eastern side, @Identifier[condition:wisping]{wisping} creatures can be harmed and cannot
        be @Identifier[ability:summon-the-dead]{put back into their bodies}.</p>
    type: rule
