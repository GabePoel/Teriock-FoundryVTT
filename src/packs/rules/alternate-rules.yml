name: Alternate Rules
pages:
  - _id: softerClassArmor
    _key: "!journal.pages!alternate0000000.softerClassArmor"
    name: Softer Class Armor Restrictions
    system:
      identifier: softer-class-armor-restrictions
      img: systems/teriock/src/assets/thumbnails/power/learned-elder-sorceries.webp
    text:
      content: >-
        <p>If you wear @UUID[Compendium.teriock.tables.RollTable.ed3267c1d2c3a7f4]{armor} above a
        @Pack[teriock.classes]{class'} maximum @Identifier[core:armor-class]{AV}, you lose
        @Identifier[core:proficiency-bonus]{proficiency} in its @Pack[teriock.abilities]{abilities} instead of losing
        the @Pack[teriock.abilities]{abilities} entirely.</p>
    type: rule
  - _id: noClassLearningR
    _key: "!journal.pages!alternate0000000.noClassLearningR"
    name: No Class Learning Restrictions
    system:
      identifier: no-class-learning-restrictions
      img: systems/teriock/src/assets/thumbnails/power/learned-elder-sorceries.webp
    text:
      content: >-
        <p>@Identifier[archetype:mage]{Mage classes} can train as @Identifier[archetype:warrior]{warrior classes} and
        vice versa instead of being prevented from learning the other @Pack[teriock.classes]{classes} at all.</p>
    type: rule
sort: 0
