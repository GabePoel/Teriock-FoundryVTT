flags:
  teriock:
    ruleIcon: ms-bolt
    ruleType: source
name: Power Sources
pages:
  - _id: magical000000000
    _key: "!journal.pages!source0000000000.magical000000000"
    name: Magical
    system:
      identifier: magical
      img: systems/teriock/src/assets/thumbnails/source/magical.webp
    text:
      content: >-
        <p><b>Magically powered effects</b> are backed by arcane energies. They are aften the result of some
        @Wiki[Category:Spells]{spell} or the direct harnessing of @Wiki[Category:Elemental abilities]{elemental}
        @Identifier[core:hit-points-and-mana-points]{mana}.</p>
    type: rule
  - _id: martial000000000
    _key: "!journal.pages!source0000000000.martial000000000"
    name: Martial
    system:
      identifier: martial
      img: icons/skills/melee/unarmed-punch-fist.webp
    text:
      content: >-
        <p><b>Martially powered effects</b> are the result of physical prowess, effort, or pure skill. They are mundane
        but can still be quite impressive or powerful.</p>
    type: rule
  - _id: divine0000000000
    _key: "!journal.pages!source0000000000.divine0000000000"
    name: Divine
    system:
      identifier: divine
      img: icons/magic/holy/prayer-hands-glowing-yellow.webp
    text:
      content: <p><b>Divinely powered effects</b> are granted through a connection to a deity or collective faith.</p>
    type: rule
  - _id: financial0000000
    _key: "!journal.pages!source0000000000.financial0000000"
    name: Financial
    system:
      identifier: financial
      img: icons/containers/bags/coinpouch-gold-red.webp
    text:
      content: >-
        <p><b>Financially powered effects</b> are the result of abstract economic and monetary forces as well as
        collective behavior.</p>
    type: rule
  - _id: spiritual0000000
    _key: "!journal.pages!source0000000000.spiritual0000000"
    name: Spiritual
    system:
      identifier: spiritual
      img: systems/teriock/src/assets/thumbnails/source/spiritual.webp
    text:
      content: <p><b>Spiritually powered effects</b> depend on an inner willpower, focus, and essence of the self.</p>
    type: rule
  - _id: alchemical000000
    _key: "!journal.pages!source0000000000.alchemical000000"
    name: Alchemical
    system:
      identifier: alchemical
      img: systems/teriock/src/assets/thumbnails/source/alchemical.webp
    text:
      content: >-
        <p><b>Alchemically powered effects</b> are caused by chemical or esoteric reactions between different materials
        and reagents.</p>
    type: rule
  - _id: material00000000
    _key: "!journal.pages!source0000000000.material00000000"
    name: Material
    system:
      identifier: material
      img: systems/teriock/src/assets/thumbnails/source/material.webp
    text:
      content: >-
        <p><b>Materially powered effects</b> are the result of intrinsic features of some material things are made
        of.</p>
    type: rule
  - _id: primal0000000000
    _key: "!journal.pages!source0000000000.primal0000000000"
    name: Primal
    system:
      identifier: primal
      img: icons/environment/wilderness/cave-entrance-mountain-blue.webp
    text:
      content: <p><b>Primal powered effects</b> draw upon forces and energies of the natural world.</p>
    type: rule
  - _id: technological000
    _key: "!journal.pages!source0000000000.technological000"
    name: Technological
    system:
      identifier: technological
      img: systems/teriock/src/assets/thumbnails/source/technological.webp
    text:
      content: <p><b>Technologically powered effects</b> are the result of mechanisms and machinery.</p>
    type: rule
  - _id: unknown000000000
    _key: "!journal.pages!source0000000000.unknown000000000"
    name: Unknown
    system:
      identifier: unknown
      img: icons/magic/symbols/question-stone-yellow.webp
    text:
      content: >-
        <p>There are more @UUID[Compendium.teriock.rules.JournalEntry.source0000000000]{power sources} than are commonly
        known or understood. This means some effects have an <b>unknown power source</b>. These effects are often
        bizarre or seem to violate some supposed metaphysical rule.</p>
    type: rule
sort: 0
