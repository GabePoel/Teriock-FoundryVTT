_key: "!macros!b7f3a91c2d6e480a"
command: >-
  const defaults = { documents: {}, pseudos: {} };

  const traverseSchema = (schema) => {
    for (const [name, field] of Object.entries(schema?.fields ?? {})) {
      const types = field.element?.types ?? field.types;
      if (types) {
        defaults.pseudos[name] ??= {};
        for (const [type, sub] of Object.entries(types)) {
          defaults.pseudos[name][type] ??= sub.getInitialValue({});
        }
      } else if (field?.fields) {
        traverseSchema(field);
      }
    }
  };

  for (const documentName of ["Actor", "Item", "ActiveEffect", "JournalEntryPage", "RollTable", "JournalEntry", "Scene",
  "TableResult"]) {
    const Cls = foundry.utils.getDocumentClass(documentName);
    const types = Cls.TYPES.filter(t => t !== "base");
    defaults.documents[documentName] = {};
    if (!types.length) {
      defaults.documents[documentName].base = new Cls({ name: "Default" }).toObject();
      continue;
    }
    for (const type of types) {
      defaults.documents[documentName][type] = new Cls({ name: "Default", type, range: [-9999, 9999] }).toObject();
      traverseSchema(CONFIG[documentName]?.dataModels?.[type]?.schema);
    }
  }

  const pseudoCount = Object.values(defaults.pseudos).reduce((sum, t) => sum + Object.keys(t).length, 0);

  const typeCount = Object.values(defaults.documents).reduce((sum, t) => sum + Object.keys(t).length, 0);

  if (!pseudoCount || !typeCount) {
    throw new Error("Schema walk found nothing; dump-schema-defaults needs updating.");
  }

  foundry.utils.saveDataToFile(JSON.stringify(defaults, null, 2), "application/json", "defaults.json");

  ui.notifications.info("Move download to Teriock-FoundryVTT/scripts/compendium/defaults.json.");
