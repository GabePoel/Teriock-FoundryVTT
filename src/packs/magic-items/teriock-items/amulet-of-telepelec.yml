    img: systems/teriock/src/icons/abilities/circle-of-protection.webp
    name: Circle of Protection
    system:
      automations:
        - _id: 72ce567009179bea
          duration:
            raw: "@h"
            unit: day
          heighten:
            - 1
          type: duration
        - _id: I9LeXqaXAPet0yHz
          attachToToken: false
          deleteOnTurnChange: false
          expandWithToken: false
          radius: "30"
          restriction:
            enabled: true
            type: move
          targeting: false
          type: region
      costs:
        primary:
          mp:
            formula: "1"
            type: formula
      delivery: hand
      duration:
        raw: "8"
        unit: hour
      elements:
        - life
      executionTime:
        base: 10 Minutes
        slow:
          raw: "10"
          unit: minute
      heightened: >-
        <p>For each additional @Identifier[core:hit-points-and-mana-points]{MP} spent, the
        @Identifier[core:duration]{duration} of this effect increases by 24 hours.</p>
      identifier: circle-of-protection
      interaction: manifest
      kind: special
      maneuver: slow
      overview:
        base: >-
          <p>You enchant an area no larger than 30 feet in any direction. This area is surrounded by a barrier of light
          that creatures cannot easily pass into or out of this area by any means, including @Wiki[Category:Displacement
          effects]{displacement effects}. However, @Identifier[property:ranged]{items} can move in and out.
          @Wiki[Category:Missile delivery abilities]{missile abilities} and other ones with a sufficiently large
          @Identifier[core:range]{range} can cross this barrier so long as their executor remains on one side and makes
          a @Identifier[core:strength]{STR} @Identifier[core:feat-interaction]{feat save}. A creature that's higher
          @Identifier[core:leveling-up]{level} than you may pass across this barrier without issue. Any other creature
          may attempt to pass by making a @Identifier[tradecraft:priest]{priest check} with a
          @Identifier[core:difficulty-class]{DC} equal to the difference between @Identifier[core:leveling-up]{your
          level} and theirs.</p>
        fluent: >-
          <p>You may select up to 2 × @Identifier[core:fluency-bonus]{F} creatures that can pass through this barrier
          without issue. You may also select up to 2 × @Identifier[core:fluency-bonus]{F} creatures that cannot pass
          through this barrier at all.</p>
        proficient: >-
          <p>You may select up to 2 × @Identifier[core:proficiency-bonus]{P} creatures that can pass through this
          barrier without issue. You may also select up to 2 × @Identifier[core:proficiency-bonus]{P} creatures that
          cannot pass through this barrier at all.</p>
      powerSources:
        - magical
      ritual: true
      rotator: true
      spell: true
      standard: true
      targets:
        - area
    type: ability
