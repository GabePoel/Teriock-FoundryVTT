  - _id: RE7zCZxS63ZOlyXr
    _key: "!items.effects!2aec4f7a72d3cff1.RE7zCZxS63ZOlyXr"
    img: systems/teriock/src/icons/abilities/rebirth.webp
    name: Rebirth
    system:
      _sup: 823nqH198nACfJpj
      delivery: hand
      effectTypes:
        - healing
        - revival
      elements:
        - life
      heightened: >-
        For each additional @Identifier[core:hit-points-and-mana-points]{MP} spent, target can have been
        @Identifier[condition:dead]{dead} for an additional 10 minutes. If target is @Wiki[Category:Undead
        creatures]{undead}, they are @Identifier[core:healing]{healed} an additional time.
      kind: special
      overview:
        fluent: >-
          If target is @Wiki[Category:Undead creatures]{undead}, they are @Identifier[core:healing]{healed} for
          @Identifier[core:damage]{damage} @Identififer[core:fluency-bonus]{F} times.
        proficient: >-
          If target is @Wiki[Category:Undead creatures]{undead}, they are @Identifier[core:healing]{healed} for
          @Identifier[core:damage]{damage} @Identifier[core:proficiency-bonus]{P} times.
      powerSources:
        - magical
      range:
        unit: self
      requirements: >-
        Target is @Wiki[Category:Undead creatures]{undead} or has @Identifier[condition:dead]{died} within the last 10
        minutes.
      results:
        hit: >-
          If target is @Identifier[condition:dead]{dead}, they are brought back to life. If they had less than 1
          @Identifier[core:hit-points-and-mana-points]{HP}, they have 1
          @Identifier[core:hit-points-and-mana-points]{HP}. If they had less than 1
          @Identifier[core:hit-points-and-mana-points]{MP}, they have 1
          @Identifier[core:hit-points-and-mana-points]{MP}. Otherwise, their
          @Identifier[core:hit-points-and-mana-points]{HP} and @Identifier[core:hit-points-and-mana-points]{MP} do not
          change. If target is @Wiki[Category:Undead creatures]{undead}, you can choose to have them be
          @Identifier[core:healing]{healed} for @Identifier[core:damage]{damage}. Rebirth does not count as a
          @Wiki[Category:Healing effects]{healing effect} unless you choose to @Identifier[core:healing]{heal} with it.
      rotator: true
      spell: true
      standard: true
    type: ability
