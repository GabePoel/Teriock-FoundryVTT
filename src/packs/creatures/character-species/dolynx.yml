          competence:
            raw: 1
          costs:
            components:
              material:
                description: <p>Creation cost is at least 3 × the material components of the spell itself.</p>
                type: description
            primary:
              hp:
                description: >-
                  <p>Creation cost is at least 3 × @Identifier[core:hit-points-and-mana-points]{HP} of the spell
                  itself.</p>
              mp:
                description: >-
                  <p>Creation cost is at least 1 @Identifier[core:hit-points-and-mana-points]{MP} per
                  @Identifier[core:elder-sorcery]{OP} of <i>each</i> @Identifier[core:elder-sorcery-words]{word} in the
                  spell plus 3 × @Identifier[core:hit-points-and-mana-points]{MP} of the spell itself.</p>
          delivery: sight
          elderSorcery: true
          executionTime:
            base: Long Rest
            slow:
              unit: longRest
          interaction: manifest
          kind: special
          limitation: >-
            <p>Any @Identifier[core:elder-sorcery]{Elder Sorcery spells} you make must cost exactly 1
            @Identifier[core:hit-points-and-mana-points]{MP} (and be balanced accordingly).</p>
          maneuver: slow
          overview:
            base: >-
              <p>You may create 1 custom "rotator" @Identifier[keyword:spell]{spell} using
              @Identifier[core:elder-sorcery-words]{elder sorcery words} that you know using whatever
              @Identifier[core:elder-sorcery]{Elder Sorcery} creation rules are dictated to you by your
              @Identifier[core:game-master]{GM}. As with other @Wiki[Category:Rotator spells]{rotators}, this spell is
              not always available to you. You have to "rotate" into having it prepared. This spell may have a maximum
              number of @Identifier[core:elder-sorcery-words]{words} equal to your @Identifier[core:leveling-up]{level}.
              Your @Identifier[core:game-master]{GM} may allow you to "improvise" @Identifier[keyword:spell]{spells} as
              well, using whatever rules they wish.</p>
            fluent: >-
              <p>In addition to the spells that you create, you can learn @Identifier[core:proficiency-bonus]{P}
              additional spells from other @Identifier[core:elder-sorcery]{Elder Sorcery} users. See
              @Identifier[core:elder-sorcery]{Elder Sorcery} for more information.</p>
            proficient: >-
              <p>You may now create 2 × (@Identifier[archetype:mage]{MR} - 1) custom "rotator"
              @Identifier[keyword:spell]{spells} where @Identifier[archetype:mage]{MR} is the number of
              @Identifier[core:leveling-up]{ranks} you have in @Identifier[archetype:mage]{mage classes}.</p>
          powerSources:
            - magical
          ritual: true
          skill: true
          slug: elder-sorcery-creation
          targets:
            - self
        type: ability
