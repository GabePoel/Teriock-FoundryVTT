    img: systems/teriock/src/assets/thumbnails/creature/kraken-head.webp
    name: Kraken Head
    system:
      appearance: <p>An enormous @Identifier[creature:squid]{squid} covered in scaly armor.</p>
      br: 18
      description: >-
        <p>A single kraken is represented by multiple different creatures at once. There is one [[lookup name style=lc]]
        and at least one @Identifier[creature:kraken-arm]{kraken arm}. If the [[lookup name style=lc]]
        @Identifier[condition:dead]{dies} then each @Identifier[creature:kraken-arm]{kraken arm} does as well.
        Otherwise, each @Identifier[creature:kraken-arm]{kraken arm} acts independently. No
        @UUID[Compendium.teriock.rules.JournalEntry.condition0000000]{conditions} other than
        @Identifier[condition:dead]{death} are shared. However, each @Identifier[creature:kraken-arm]{kraken arm} cannot
        go more than the [[lookup name style=lc]]'s @Identifier[core:size]{size} × 5 feet away from the [[lookup name
        style=lc]].</p>
      families:
        - cephalopod
        - kraken
      hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
      morph:
        img: systems/teriock/src/assets/thumbnails/creature/kraken-head.webp
        ring: true
        ringImg: systems/teriock/src/assets/thumbnails/token/kraken-head.webp
      size:
        max: 7
        min: 5
        value: 5
      slug: kraken-head
      statDice:
        hp:
          formula: (@this.item.size - 1)d10
      traits:
        - animal
        - aquatic
        - monstrous
    type: species
