    folder: dbf885a327caa735
    img: systems/teriock/src/icons/creatures/koolasoka-head.webp
    name: Koolasoka Head
    system:
      appearance: <p>Koolasokas look like giant sea-faring amphibians with striking tongues and limbs.</p>
      br: 11
      description: >-
        <p>Koolasokas are found throughout the seas of Teriock in coastal caves they always have four legs. A single
        koolasoka is represented by multiple different creatures at once. There is one <a>koolasoka head</a> and at
        least one @Identifier[creature:koolasoka-leg]{koolasoka leg}. If the <a>koolasoka head</a>
        @Identifier[condition:dead]{dies} then each @Identifier[creature:koolasoka-leg]{koolasoka leg} does as well.
        Otherwise, each @Identifier[creature:koolasoka-leg]{koolasoka leg} acts independently. No
        @UUID[Compendium.teriock.rules.JournalEntry.condition0000000]{conditions} other than
        @Identifier[condition:dead]{death} are shared. However, each @Identifier[creature:koolasoka-leg]{koolasoka leg}
        cannot go more than the <a>koolasoka head's</a> @Identifier[core:size]{size} × 5 feet away from the <a>koolasoka
        head</a>.</p>
      identifier: koolasoka-head
      size:
        value: 7
      statDice:
        hp:
          formula: 5d10
        mp:
          formula: 1d6
      traits:
        - animal
        - monstrous
      transformation:
        img: systems/teriock/src/icons/creatures/koolasoka-head.webp
        ring: true
        ringImg: systems/teriock/src/icons/tokens/koolasoka-head.webp
    type: species
