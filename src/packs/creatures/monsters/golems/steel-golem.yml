    img: systems/teriock/src/icons/creatures/steel-golem.webp
    name: Steel Golem
    system:
      appearance: <p>@Wiki[Category:Humanoid creatures]{Humanoid} statue made of steel.</p>
      attributeIncrease: >-
        <p>@Identifier[ability:improved-strength]{Improved Strength} if at least @Identifier[core:size]{size} 3.
        @Identifier[ability:giant-strength]{Giant Strength} if at least @Identifier[core:size]{size} 4.
        @Identifier[ability:supernatural-strength]{Supernatural Strength} if at least @Identifier[core:size]{size} 6.
        @Identifier[ability:monstrous-strength]{Monstrous Strength} if at least @Identifier[core:size]{size} 8.</p>
      automations:
        - _id: b7dc74afdec1a704
          add:
            - ability:improved-strength
          qualifier: and(gte(@species.size, 3), lt(@species.size, 4))
          remove:
            - ability:beastly-strength
            - ability:giant-strength
            - ability:supernatural-strength
            - ability:monstrous-strength
          trigger: updateDocument
          type: toggleChildren
        - _id: 1d5376fc7aec0a48
          add:
            - ability:beastly-strength
          qualifier: and(gte(@species.size, 0), lt(@species.size, 3))
          remove:
            - ability:improved-strength
            - ability:giant-strength
            - ability:supernatural-strength
            - ability:monstrous-strength
          trigger: updateDocument
          type: toggleChildren
        - _id: 37634d0e6b2fae07
          add:
            - ability:giant-strength
          qualifier: and(gte(@species.size, 4), lt(@species.size, 6))
          remove:
            - ability:improved-strength
            - ability:beastly-strength
            - ability:supernatural-strength
            - ability:monstrous-strength
          trigger: updateDocument
          type: toggleChildren
        - _id: ab3de966a8f99c9c
          add:
            - ability:supernatural-strength
          qualifier: and(gte(@species.size, 6), lt(@species.size, 8))
          remove:
            - ability:improved-strength
            - ability:beastly-strength
            - ability:giant-strength
            - ability:monstrous-strength
          trigger: updateDocument
          type: toggleChildren
        - _id: 056bba8fd332660a
          add:
            - ability:monstrous-strength
          qualifier: and(gte(@species.size, 8), lt(@species.size, 99))
          remove:
            - ability:improved-strength
            - ability:beastly-strength
            - ability:giant-strength
            - ability:supernatural-strength
          trigger: updateDocument
          type: toggleChildren
      br: 46
      description: >-
        <p>@UUID[Compendium.teriock.tables.RollTable.68067747b6a57d8c]{Golems} are built as sentries to guard particular
        spots or items and have a trigger system that activates them. They generally follow a set "program" while
        active.</p>
      hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
      identifier: steel-golem
      innateRanks: <p>Innately @Pack[teriock.classes]{rank} 4.</p>
      instructions: <p>Add the chosen innate @Pack[teriock.classes]{ranks} manually.</p>
      size:
        max: 10
        min: 1
        value: 1
      statDice:
        hp:
          formula: (@species.size + 2)d20
        mp:
          formula: 2d10
      traits:
        - construct
        - humanoid
      transformation:
        img: systems/teriock/src/icons/creatures/steel-golem.webp
        ring: true
        ringImg: systems/teriock/src/icons/tokens/steel-golem.webp
    type: species
