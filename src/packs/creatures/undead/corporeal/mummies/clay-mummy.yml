          overview:
            base: >-
              <p>[[lookup name]] is a ritual that allows you to bond with an animal companion. As part of this ritual,
              you call an animal to you and it chooses whether or not to become your <b>familiar</b>. If it chooses to
              be your familiar, you and it are @Wiki[Category:Spiritual effects]{spiritually} bonded. You can sense
              feelings and emotions from your familiar and speak to other animals of the same species. Your familiar can
              sense your feelings and emotions as well. You also gain an @Identifier[tradecraft:animal-tamer]{animal
              tamer} @Identifier[core:fluency-bonus]{fluency} for your familiar's species. This does not grant you
              @Identifier[core:proficiency-bonus]{proficiency} with @Identifier[tradecraft:animal-tamer]{animal tamer}
