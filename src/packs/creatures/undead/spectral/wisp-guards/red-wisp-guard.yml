          overview:
            base: >-
              <p>You may use your @Identifier[property:magelore]{magelore} items as though they were your
              @Identifier[body:hand]{hand}. This makes them @Identifier[property:handy]{handy} and
              @Identifier[property:prehensile]{prehensile}. You are not @Identifier[core:proficiency-bonus]{proficient}
              nor @Identifier[core:fluency-bonus]{fluent} with @Pack[teriock.abilities]{abilities} you use through your
              @Identifier[property:magelore]{magelore} items.</p>
            fluent: >-
              <p>If you are @Identifier[core:fluency-bonus]{fluent} with an @Pack[teriock.abilities]{ability} you use
