              @Identifier[core:hit-points-and-mana-points]{HP} and @Identifier[core:hit-points-and-mana-points]{MP} are
              both increased to 1 if they were less than that value. However, the target's maximum
              @Identifier[core:hit-points-and-mana-points]{HP} and @Identifier[core:hit-points-and-mana-points]{MP} are
              both halved to a minimum of 1. This effect lasts until the @Identifier[core:targets]{target} completes a
