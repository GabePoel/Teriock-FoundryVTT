name: Huge Earth Elemental
system:
  appearance: >-
    <p>Appear as a mass of earth. This amorphous state is their default form, but elementals can also take a humanoid
    form which resembles a human with an odd skin color.</p>
  br: 26
  hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
  identifier: huge-earth-elemental
  innateRanks: <p>Innately @Pack[teriock.classes]{rank} 5 @Identifier[class:nature-mage]{Nature Mage}.</p>
  size:
    max: 10
    min: 9
    value: 9
  statDice:
    hp:
      formula: (@species.size)d6
    mp:
      formula: 6d6
  traits:
    - elemental
    - outsider
  transformation:
    img: systems/teriock/src/icons/creatures/huge-earth-elemental.webp
    ring: true
    ringImg: systems/teriock/src/icons/tokens/huge-earth-elemental.webp
type: species
