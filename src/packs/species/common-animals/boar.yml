img: systems/teriock/src/icons/creatures/boar.webp
name: Boar
system:
  attributeIncrease: >-
    <p>@Identifier[ability:normal-strength]{Normal Strength} if at least @Identifier[core:size]{size} 2.
    @Identifier[ability:beastly-strength]{Beastly Strength} if at least @Identifier[core:size]{size} 3.
    @Identifier[ability:improved-strength]{Improved Strength} if at least @Identifier[core:size]{size} 4.</p>
  automations:
    - _id: 554a612832c648e9
      add:
        - ability:normal-strength
      qualifier: and(gte(@species.size, 2), lt(@species.size, 3))
      remove:
        - ability:low-strength
        - ability:beastly-strength
        - ability:improved-strength
      trigger: updateDocument
      type: toggleChildren
    - _id: e052984bed228186
      add:
        - ability:low-strength
      qualifier: and(gte(@species.size, 0), lt(@species.size, 2))
      remove:
        - ability:normal-strength
        - ability:beastly-strength
        - ability:improved-strength
      trigger: updateDocument
      type: toggleChildren
    - _id: 1d5376fc7aec0a48
      add:
        - ability:beastly-strength
      qualifier: and(gte(@species.size, 3), lt(@species.size, 4))
      remove:
        - ability:normal-strength
        - ability:low-strength
        - ability:improved-strength
      trigger: updateDocument
      type: toggleChildren
    - _id: b7dc74afdec1a704
      add:
        - ability:improved-strength
      qualifier: and(gte(@species.size, 4), lt(@species.size, 99))
      remove:
        - ability:normal-strength
        - ability:low-strength
        - ability:beastly-strength
      trigger: updateDocument
      type: toggleChildren
  br: 12
  hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
  identifier: boar
  size:
    max: 4
    min: 1
    value: 1
  statDice:
    hp:
      formula: (@species.size)d6
    mp:
      formula: 1d6
  traits:
    - animal
  transformation:
    img: systems/teriock/src/icons/creatures/boar.webp
    ring: true
    ringImg: systems/teriock/src/icons/tokens/boar.webp
type: species
