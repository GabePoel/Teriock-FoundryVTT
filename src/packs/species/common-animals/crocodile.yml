folder: 30f4d11e5e53d332
img: systems/teriock/src/assets/thumbnails/creature/crocodile.webp
name: Crocodile
system:
  attributeIncrease: >-
    <p>@Identifier[ability:beastly-strength]{Beastly Strength} if at least @Identifier[core:size]{size} 3.
    @Identifier[ability:improved-strength]{Improved Strength} if at least @Identifier[core:size]{size} 4.
    @Identifier[ability:giant-strength]{Giant Strength} if at least @Identifier[core:size]{size} 5.</p>
  automations:
    - _id: 1d5376fc7aec0a48
      add:
        - ability:beastly-strength
      qualifier: and(gte(@this.item.size, 3), lt(@this.item.size, 4))
      remove:
        - ability:giant-strength
        - ability:improved-strength
        - ability:normal-strength
      type: toggleChildren
    - _id: 554a612832c648e9
      add:
        - ability:normal-strength
      qualifier: and(gte(@this.item.size, 0), lt(@this.item.size, 3))
      remove:
        - ability:beastly-strength
        - ability:giant-strength
        - ability:improved-strength
      type: toggleChildren
    - _id: b7dc74afdec1a704
      add:
        - ability:improved-strength
      qualifier: and(gte(@this.item.size, 4), lt(@this.item.size, 5))
      remove:
        - ability:beastly-strength
        - ability:giant-strength
        - ability:normal-strength
      type: toggleChildren
    - _id: 37634d0e6b2fae07
      add:
        - ability:giant-strength
      qualifier: and(gte(@this.item.size, 5), lt(@this.item.size, 99))
      remove:
        - ability:beastly-strength
        - ability:improved-strength
        - ability:normal-strength
      type: toggleChildren
  br: 8
  hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
  identifier: crocodile
  size:
    max: 5
    min: 2
    value: 2
  statDice:
    hp:
      formula: (@this.item.size - 1)d8
    mp:
      formula: 1d6
  traits:
    - animal
  transformation:
    img: systems/teriock/src/assets/thumbnails/creature/crocodile.webp
    ring: true
    ringImg: systems/teriock/src/assets/thumbnails/token/crocodile.webp
type: species
