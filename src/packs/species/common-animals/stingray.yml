folder: 30f4d11e5e53d332
img: systems/teriock/src/assets/thumbnails/creature/stingray.webp
name: Stingray
system:
  attributeIncrease: >-
    <p>@Identifier[ability:normal-strength]{Normal Strength} if at least @Identifier[core:size]{size} 2.
    @Identifier[ability:beastly-strength]{Beastly Strength} if at least @Identifier[core:size]{size} 3.</p>
  automations:
    - _id: 554a612832c648e9
      add:
        - ability:normal-strength
      qualifier: and(gte(@this.item.size, 2), lt(@this.item.size, 3))
      remove:
        - ability:beastly-strength
        - ability:low-strength
      type: toggleChildren
    - _id: e052984bed228186
      add:
        - ability:low-strength
      qualifier: and(gte(@this.item.size, 0), lt(@this.item.size, 2))
      remove:
        - ability:beastly-strength
        - ability:normal-strength
      type: toggleChildren
    - _id: 1d5376fc7aec0a48
      add:
        - ability:beastly-strength
      qualifier: and(gte(@this.item.size, 3), lt(@this.item.size, 99))
      remove:
        - ability:low-strength
        - ability:normal-strength
      type: toggleChildren
  br: 3
  hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
  identifier: stingray
  size:
    max: 3
    min: 1
    value: 1
  statDice:
    hp:
      formula: (@this.item.size)d6
    mp:
      formula: 1d6
  traits:
    - animal
    - aquatic
  transformation:
    img: systems/teriock/src/assets/thumbnails/creature/stingray.webp
    ring: true
    ringImg: systems/teriock/src/assets/thumbnails/token/stingray.webp
type: species
