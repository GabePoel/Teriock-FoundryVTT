name: Boa Constrictor
system:
  attributeIncrease: >-
    <p>@Identifier[ability:beastly-strength]{Beastly Strength} if at least @Identifier[core:size]{size} 3.
    @Identifier[ability:improved-strength]{Improved Strength} if at least @Identifier[core:size]{size} 4.
    @Identifier[ability:giant-strength]{Giant Strength} if at least @Identifier[core:size]{size} 5.</p>
  automations:
    - _id: 1d5376fc7aec0a48
      add:
        - ability:beastly-strength
      qualifier: and(gte(@species.size, 3), lt(@species.size, 4))
      remove:
        - ability:normal-strength
        - ability:improved-strength
        - ability:giant-strength
      trigger: updateDocument
      type: toggleChildren
    - _id: 554a612832c648e9
      add:
        - ability:normal-strength
      qualifier: and(gte(@species.size, 0), lt(@species.size, 3))
      remove:
        - ability:beastly-strength
        - ability:improved-strength
        - ability:giant-strength
      trigger: updateDocument
      type: toggleChildren
    - _id: b7dc74afdec1a704
      add:
        - ability:improved-strength
      qualifier: and(gte(@species.size, 4), lt(@species.size, 5))
      remove:
        - ability:beastly-strength
        - ability:normal-strength
        - ability:giant-strength
      trigger: updateDocument
      type: toggleChildren
    - _id: 37634d0e6b2fae07
      add:
        - ability:giant-strength
      qualifier: and(gte(@species.size, 5), lt(@species.size, 99))
      remove:
        - ability:beastly-strength
        - ability:normal-strength
        - ability:improved-strength
      trigger: updateDocument
      type: toggleChildren
  br: 4
  hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
  identifier: boa-constrictor
  size:
    max: 5
    min: 2
    value: 2
