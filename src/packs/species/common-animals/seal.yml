img: systems/teriock/src/assets/thumbnails/creature/seal.webp
name: Seal
system:
  attributeIncrease: >-
    <p>@Identifier[ability:beastly-strength]{Beastly Strength} if at least @Identifier[core:size]{size} 3.
    @Identifier[ability:improved-strength]{Improved Strength} if at least @Identifier[core:size]{size} 4.</p>
  automations:
    - _id: 1d5376fc7aec0a48
      add:
        - ability:beastly-strength
      qualifier: and(gte(@this.item.size, 3), lt(@this.item.size, 4))
      remove:
        - ability:improved-strength
        - ability:normal-strength
      type: toggleChildren
    - _id: 554a612832c648e9
      add:
        - ability:normal-strength
      qualifier: and(gte(@this.item.size, 0), lt(@this.item.size, 3))
      remove:
        - ability:beastly-strength
        - ability:improved-strength
      type: toggleChildren
    - _id: b7dc74afdec1a704
      add:
        - ability:improved-strength
      qualifier: and(gte(@this.item.size, 4), lt(@this.item.size, 99))
      remove:
        - ability:beastly-strength
        - ability:normal-strength
      type: toggleChildren
  br: 2
  hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
  identifier: seal
  size:
    max: 4
    min: 2
    value: 2
  statDice:
    hp:
      formula: (@this.item.size - 1)d8
    mp:
      formula: 1d6
  traits:
    - animal
  transformation:
    img: systems/teriock/src/assets/thumbnails/creature/seal.webp
    ring: true
    ringImg: systems/teriock/src/assets/thumbnails/token/seal.webp
type: species
