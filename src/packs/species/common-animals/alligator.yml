img: systems/teriock/src/assets/thumbnails/creature/alligator.webp
name: Alligator
system:
  attributeIncrease: >-
    <p>@Identifier[ability:normal-strength]{Normal Strength} if at least @Identifier[core:size]{size} 2.
    @Identifier[ability:beastly-strength]{Beastly Strength} if at least @Identifier[core:size]{size} 3.
    @Identifier[ability:improved-strength]{Improved Strength} if at least @Identifier[core:size]{size} 4.</p>
  automations:
    - _id: 554a612832c648e9
      add:
        - ability:normal-strength
      qualifier: and(gte(@this.item.size, 2), lt(@this.item.size, 3))
      remove:
        - ability:beastly-strength
        - ability:improved-strength
        - ability:low-strength
      type: toggleChildren
    - _id: e052984bed228186
      add:
        - ability:low-strength
      qualifier: and(gte(@this.item.size, 0), lt(@this.item.size, 2))
      remove:
        - ability:beastly-strength
        - ability:improved-strength
        - ability:normal-strength
      type: toggleChildren
    - _id: 1d5376fc7aec0a48
      add:
        - ability:beastly-strength
      qualifier: and(gte(@this.item.size, 3), lt(@this.item.size, 4))
      remove:
        - ability:improved-strength
        - ability:low-strength
        - ability:normal-strength
      type: toggleChildren
    - _id: b7dc74afdec1a704
      add:
        - ability:improved-strength
      qualifier: and(gte(@this.item.size, 4), lt(@this.item.size, 99))
      remove:
        - ability:beastly-strength
        - ability:low-strength
        - ability:normal-strength
      type: toggleChildren
  br: 5
  hpIncrease: <p>Gain another hit die for every 1 additional size.</p>
  identifier: alligator
  size:
    max: 4
    min: 1
    value: 1
  statDice:
    hp:
      formula: (@this.item.size)d8
    mp:
      formula: 1d6
  traits:
    - animal
  transformation:
    img: systems/teriock/src/assets/thumbnails/creature/alligator.webp
    ring: true
    ringImg: systems/teriock/src/assets/thumbnails/token/alligator.webp
type: species
