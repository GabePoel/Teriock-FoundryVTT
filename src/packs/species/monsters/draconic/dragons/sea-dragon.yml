        base: >-
          <p>You gain @Identifier[ability:innate-elder-sorcery]{Innate Elder Sorcery},
          @Identifier[ability:elder-sorcery-adept]{Elder Sorcery Adept}, and @Identifier[ability:dragon-snapcast]{Dragon
