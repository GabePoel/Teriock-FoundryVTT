img: systems/teriock/src/icons/creatures/steel-drake.webp
name: Steel Drake
system:
  appearance: <p>Similar to @Identifier[creature:steel-dragon]{steel dragons}, but smaller and more bestial.</p>
  br: 13
  description: >-
    <p>These "half-dragons" are a hybrid of @UUID[Compendium.teriock.tables.RollTable.997cd433ccad17d7]{dragons} created
    by @Identifier[core:elder-sorcery]{Elder Sorcery}.
    @UUID[Compendium.teriock.tables.RollTable.997cd433ccad17d7]{Dragons} hate these beasts, who possess little
    intelligence beyond the desire to kill. Drakes can be ridden and are often found as mounts for imperial guards. They
    spawn drakespawn.</p>
  identifier: steel-drake
  innateRanks: <p>Innately @Pack[teriock.classes]{rank} 1 @Identifier[class:knight]{Knight}.</p>
  size:
    value: 5
  statDice:
    hp:
      formula: 5d10
  traits:
    - draconic
    - monstrous
  transformation:
    img: systems/teriock/src/icons/creatures/steel-drake.webp
    ring: true
    ringImg: systems/teriock/src/icons/tokens/steel-drake.webp
type: species
