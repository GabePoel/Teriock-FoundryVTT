img: systems/teriock/src/icons/creatures/leather-drake.webp
name: Leather Drake
system:
  appearance: <p>Similar to @Identifier[creature:leather-dragon]{leather dragons}, but smaller and more bestial.</p>
  br: 13
  description: >-
    <p>These "half-dragons" are a hybrid of @UUID[Compendium.teriock.tables.RollTable.997cd433ccad17d7]{dragons} created
    by @Identifier[core:elder-sorcery]{Elder Sorcery}.
    @UUID[Compendium.teriock.tables.RollTable.997cd433ccad17d7]{Dragons} hate these beasts, who possess little
    intelligence beyond the desire to kill. Drakes can be ridden and are often found as mounts for imperial guards. They
    spawn drakespawn.</p>
  identifier: leather-drake
  innateRanks: <p>Innately @Pack[teriock.classes]{rank} 1 @Identifier[class:ranger]{Ranger}.</p>
  size:
    value: 5
  statDice:
    hp:
      formula: 5d10
  traits:
    - draconic
    - monstrous
  transformation:
    img: systems/teriock/src/icons/creatures/leather-drake.webp
    ringImg: systems/teriock/src/icons/tokens/leather-drake.webp
type: species
