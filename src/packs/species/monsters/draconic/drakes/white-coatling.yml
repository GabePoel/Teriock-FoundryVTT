img: systems/teriock/src/icons/creatures/white-coatling.webp
name: White Coatling
system:
  appearance: >-
    <p>As @UUID[Compendium.teriock.tables.RollTable.997cd433ccad17d7]{drakes} but slightly longer, more slender, and
    with enormous multi-colored feathered wings.</p>
  br: 15
  description: >-
    <p>These rare beings sometimes seem to be enchanted with passive effects that generate or mutate swarms of
    @Wiki[Category:Insects]{elemental and other insects} around them. These creatures are very aggressive and seem to
    have an uncanny awareness of their circumstances and surroundings.</p>
  identifier: white-coatling
  innateRanks: >-
    <p>Innately @Pack[teriock.classes]{rank} 2 @Identifier[class:life-mage]{Life Mage}. Innately
    @Pack[teriock.classes]{rank} 1 @Identifier[class:nature-mage]{Nature Mage}.</p>
  size:
    value: 5
  statDice:
    hp:
      formula: 6d10
    mp:
      formula: 2d10
  traits:
    - draconic
    - elemental
  transformation:
    img: systems/teriock/src/icons/creatures/white-coatling.webp
    ring: true
    ringImg: systems/teriock/src/icons/tokens/white-coatling.webp
type: species
