name: Common Ogre
system:
  appearance: <p>Ugly muscular humanoids with sharp teeth.</p>
  br: 4
  description: >-
    <p>These people look like bigger and stronger @UUID[Compendium.teriock.tables.RollTable.10c541c05a2efaea]{orks}.
    @UUID[Compendium.teriock.tables.RollTable.d0620c450e5092db]{Ogres} have a wild culture, tending towards solitude and
    hunting smaller humanoid species for food. Relying on superior strength and toughness in combat, ogres are known to
    underestimate their foes. Ogres are often recruited by evil armies due to their hunting instincts for humanoids,
    which are their natural prey.</p>
  families:
    - ogre
  morph:
    img: systems/teriock/src/assets/thumbnails/creature/common-ogre.webp
    ring: true
    ringImg: systems/teriock/src/assets/thumbnails/token/common-ogre.webp
  size:
    value: 5
  slug: common-ogre
  statDice:
    mp:
      formula: 1d8
  traits:
    - monstrous
    - partial-humanoid
type: species
