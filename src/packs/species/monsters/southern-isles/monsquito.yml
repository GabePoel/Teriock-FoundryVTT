img: systems/teriock/src/assets/thumbnails/creature/monsquito.webp
name: Monsquito
system:
  appearance: <p>Large black mosquitos the size of pelicans.</p>
  br: 9
  description: >-
    <p>These insects are usually found on the Oni Islands, but they have slowly been spreading throughout the Southern
    Isles. They spawn in dark swamps in the cover of jungles or damp caves. They like to drink the blood of their prey
    after wounding them. And, for reasons still unknown, this appears to drain their victims of their
    @Identifier[core:hit-points-and-mana-points]{MP} as well.</p>
  morph:
    img: systems/teriock/src/assets/thumbnails/creature/monsquito.webp
    ring: true
    ringImg: systems/teriock/src/assets/thumbnails/token/monsquito.webp
  size:
    value: 1
  slug: monsquito
  statDice:
    mp:
      formula: 1d8
  traits:
    - animal
type: species
