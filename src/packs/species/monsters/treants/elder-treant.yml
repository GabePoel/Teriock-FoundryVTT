name: Elder Treant
system:
  appearance: <p>Walking @Identifier[creature:tree]{tree} with a rough face, branches for arms, and roots as feet.</p>
  br: 30
  description: >-
    <p>Elder treants are very rare, thought of as the true shepherds of the forests. They are believed to be only one
    per forest. Elder treants are very reclusive and spend most of their time dormant (in
    @Identifier[creature:tree]{tree} form). Protectors and shepherds of the forest, these ancient beings are believed to
    be descendants of @Identifier[creature:small-earth-elemental]{nature elementals} or
    @UUID[Compendium.teriock.tables.RollTable.f2c29b199c990ab7]{fae}. Each is native to a particular forest which it
    protects and maintains for hundreds of years. @UUID[Compendium.teriock.tables.RollTable.615ff873d830ae70]{Treants}
    are slow, patient beings, ever on the watch for threats to nature and protecting beings who can't protect
    themselves.</p>
  identifier: elder-treant
  size:
    value: 8
  statDice:
    hp:
      formula: 8d10
    mp:
      formula: 3d10
  traits:
    - plant
  transformation:
    img: systems/teriock/src/icons/creatures/elder-treant.webp
    ringImg: systems/teriock/src/icons/tokens/elder-treant.webp
type: species
