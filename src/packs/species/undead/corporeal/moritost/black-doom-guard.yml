system:
  appearance: >-
    <p>Suits of plate armor with a skeleton fused to the metal. A large colored gem glows faintly in the forehead of the
    helm.</p>
  br: 20
  description: >-
    <p>Used as elite guards as key units in wars, these rare creatures are simple yet effective. Doom guards are widely
    feared and hated for being extremely hard to destroy.</p>
  identifier: black-doom-guard
  innateRanks: >-
    <p>Innately @Pack[teriock.classes]{rank} 2 @Identifier[class:veteran]{Veteran}. Innately
    @Pack[teriock.classes]{rank} 1 @Identifier[class:necromancer]{Necromancer}.</p>
