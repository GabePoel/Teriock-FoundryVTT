img: systems/teriock/src/icons/ranks/rank-1-veteran.webp
name: Rank 1 Veteran
system:
  _sup: 6b9b5d18992f2e43
  archetype: warrior
  class: veteran
  description: >-
    <p>Jaded and tough, these warriors act as if they have seen it all. Obviously they are not all seasoned warriors,
    but the training of a @Identifier[class:veteran]{Veteran} involves a great deal of time in battle, so even a first
    rank @Identifier[class:veteran]{Veteran} has seen more action than other first rank warriors. The strategy of the
    @Identifier[class:veteran]{Veteran} is to be an immovable wall, and hold the line.
    @Identifier[class:veteran]{Veterans} rely on defense in battle, always working to better ensure their protection,
    which is why they survive to be veterans. If you are a @Identifier[class:veteran]{Veteran} be jaded, unimpressed,
    hard, and pessimistic.</p>
  identifier: rank-1-veteran
  maxAv: 4
  number: 1
  statDice:
    hp:
      formula: 1d12
    mp:
      formula: 1d8
type: rank
