name: Desert Saurage
system:
  adult: 12
  appearance: >-
    <p>Saurages look like humanoid lizard men and are native to the southern deserts in mainland Teriock. Desert
    saurages are about human sized and covered in scales, but have no tails.</p>
  description: >-
    <p>Saurages in Teriock have piercings corresponding to their clan of origin. Saurages are generally tribal and often
    have trouble adjusting to cities and guilds.</p><p>@Embed[Compendium.teriock.tables.RollTable.5cabb085721fa30c
    rollable]</p>
  identifier: desert-saurage
  lifespan: 75
  traits:
    - humanoid
