folder: 08634b691f84308c
img: systems/teriock/src/assets/thumbnails/creature/red-phraint.webp
name: Red Phraint
system:
  appearance: >-
    <p>Phraints look like sexless insectoid people. They are like praying mantises, but with only two arms and two
    legs.</p>
  description: >-
    <p>Phraints are from the southern Teriock deserts and have a hive-like culture in which they are constantly serving
    the queen. Phraints do not feel emotions though they are often "afraid" of water and incapable of swimming. Most
    common phraints are @Identifier[creature:green-phraint]{green} and incapable of going mage, though rarely there are
    [[lookup name style=lc]]s which must go mage and only resist fear. Phraint Queen's are
    @Identifier[creature:gold-phraint]{gold} and extremely rare and the only type that can show emotion (no fear
    protection).</p>
  families:
    - insect
    - phraint
  lifespan:
    adulthood: 12
    enabled: true
    max: 100
  morph:
    img: systems/teriock/src/assets/thumbnails/creature/red-phraint.webp
    ring: true
    ringImg: systems/teriock/src/assets/thumbnails/token/red-phraint.webp
  slug: red-phraint
type: species
