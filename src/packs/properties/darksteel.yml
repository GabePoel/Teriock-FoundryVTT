description: >-
  <p><b>[[lookup name]]</b> items are similar to @Identifier[property:dirtydark]{dirtydark} ones, but are somewhat less
  fickle. They can @Identifier[core:block-interaction]{block} @Wiki[Category:Magically powered abilities]{magically
  powered abilities} even if they are @Identifier[keyword:unblockable]{UB}. If you are wearing [[lookup name style=lc]]
  @UUID[Compendium.teriock.tables.RollTable.ed3267c1d2c3a7f4]{armor}, then @Wiki[Category:Magically powered
  abilities]{magically powered} @Identifier[core:attack-interaction]{attacks} made against you are not
  @Identifier[keyword:armor-voiding]{AV0}. [[lookup name]] items are also @Identifier[keyword:resistance]{resistant} to
  all @Wiki[Category:Magical effects]{magical effects}. However, [[lookup name style=lc]] items can also be risky to
  use. If a creature is @Identifier[keyword:bearing]{bearing} a [[lookup name style=lc]] item that gets
  @Identifier[property:shattered]{shattered} or @Identifier[property:destroyed]{destroyed}, it is as though they had
  taken [[/damage 4d20[dirtydark]]] @Identifier[core:damage]{damage} for the purpose of developing
  @Identifier[damage:dirtydark]{black rot}.</p>
