_id: 02eaf13c27898c28
_key: "!effects!02eaf13c27898c28"
img: systems/teriock/src/icons/properties/glued.webp
name: Glued
system:
  applyIfDeattuned: true
  automations:
    - _id: parameterChanges
      changes:
        - key: system.glued
          phase: derived
          priority: 10
          target: Item
          type: override
          value: "true"
      type: changes
  description: >-
    <p>If an item is <b>[[lookup name style=lc]]</b> to a creature, it is bonded to their spirit. The item and creature
    are @Identifier[keyword:immunity]{immune} to @Wiki[Category:Stealing effects]{effects that would steal it} from the
    creature's body (even if the creature is dead).</p><p class="note"><b>Note:</b> This does not prevent the creature
    from throwing, dropping, or handing off the item. In which case, the item is still [[lookup name style=lc]] to
    them.</p>
  identifier: glued
  powerSources:
    - magical
type: property
