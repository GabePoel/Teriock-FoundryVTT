description: >-
  <p>Items with this property can hit @Identifier[core:targets]{targets} at a distance. An item that can be used to make
  a <b>[[lookup name style=lc]]</b> @Identifier[core:attack-interaction]{attack} has a @Identifier[core:range]{range} in
  parentheses after specifying if it requires @Identifier[property:ammunition]{ammunition} or if is
  @Identifier[property:thrown]{thrown}. The @Identifier[core:range]{range} lists two numbers. The first is the item's
  normal @Identifier[core:range]{range} in feet, and the second indicates the item's long range. When attacking a
  @Identifier[core:targets]{target} beyond normal @Identifier[core:range]{range}, you have
  @Identifier[core:disadvantage]{disadvantage} on the @Identifier[core:attack-interaction]{attack roll}. You can't
  attack a @Identifier[core:targets]{target} beyond the item's long @Identifier[core:range]{range}.</p>
