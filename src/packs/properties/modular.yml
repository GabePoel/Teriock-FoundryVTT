description: >-
  <p>A <b>[[lookup name style=lc]]</b> item is composed of several smaller pieces of @Pack[teriock.equipment]{equipment}
  that fit together into one combined item. The combined item inherits the @Pack[teriock.properties]{properties},
  @Pack[teriock.abilities]{abilities}, and @Identifier[core:presence]{tier} of these modules. [[lookup name]] items only
  function if it has one of each of its required modules. For instance, a [[lookup name style=lc]]
  @Identifier[equipment:longsword]{longsword} may have a blade, crossguard, and hilt as separate modules.</p>
