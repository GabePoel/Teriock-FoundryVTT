name: Impressionable
system:
  applyIfDeattuned: true
  description: >-
    <p>An <b>[[lookup name style=lc]]</b> substance absorbs ingredients put into it and then, once
    @Identifier[core:hit-points-and-mana-points]{MP} is put into it, it settles and becomes a potion of unknown effect,
    based on the ingredients and amount of @Identifier[core:hit-points-and-mana-points]{MP} put in! This effect is
    @Wiki[Category:Alchemical effects]{alchemical} and is determined by the @Identifier[core:game-master]{GM}.</p>
  identifier: impressionable
  kind: intrinsic
  powerSources:
    - alchemical
type: property
