description: >-
  <p>When a creature @Identifier[core:presence]{attunes} to a <b>[[lookup name style=lc]]</b> item, they gain some
  @Identifier[keyword:curse]{curse} as specified by the item. These @Identifier[keyword:curse]{curses} are especially
  strong and challenging to get rid of. The only way to do so is to remove the item that gave the curse from the
  creature while they are dead and have the item @Identifier[core:presence]{attuned}. At
  @Identifier[core:game-master]{GM} discretion, identical items may sometimes count as the same item for the purpose of
  removing these @Identifier[keyword:curse]{curses}.</p>
