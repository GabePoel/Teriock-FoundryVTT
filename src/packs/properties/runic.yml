description: >-
  <p><b>[[lookup name]]</b> items [[/repair]]{repair} themselves. If a [[lookup name style=lc]] item is also
  @Identifier[property:shattered]{shattered}, it retains the [[lookup name style=lc]] property. When a creature is
  @Identifier[core:presence]{attuned} to a @Identifier[property:shattered]{shattered} [[lookup name style=lc]] item,
  they roll [[/roll 2d4]] at the end of each of their turns. If at least 1 die rolls a 4, the item is no longer
  @Identifier[property:shattered]{shattered}. This is a @Wiki[Category:Construction effects]{construction effect}.</p>
