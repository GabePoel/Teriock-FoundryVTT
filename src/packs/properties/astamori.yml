description: >-
  <p><b>[[lookup name]]</b> is a rare metal based on similar principles as @Identifier[property:silveel]{silveel}. Items
  made of it tend to be dark in color but with a golden glint along their edges. It is believed to have been first
  produced by the @Identifier[creature:elf]{high elves} of Andionion to enforce their belief that time should be taken
  in all matters, including the healing of wounds. [[lookup name]] items deal @Identifier[damage:astamori]{astamori
  damage}.</p>
