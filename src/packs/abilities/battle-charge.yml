name: Battle Charge
system:
  executionTime:
    base: r0
  identifier: battle-charge
  maneuver: reactive
  overview:
    base: >-
      <aside class="notification info theme-dark"><p>A @Identifier[core:targets]{target} moving due to [[lookup name]]
      can still provoke reactions like @Identifier[ability:opportunity-attack]{Opportunity Attack}.</p></aside><aside
      class="notification info theme-dark"><p>This ability can trigger in the middle of
      @Identifier[ability:move]{moving}. You could approach an enemy, trigger this ability, take an
      @Identifier[ability:opportunity-attack]{Opportunity Attack} against them, keep moving towards them, and trigger
      this ability again.</p></aside>
  piercing:
    raw: 2
  powerSources:
    - martial
  results:
    critHit: <p>@Identifier[core:targets]{Target} moves 20 feet away from you.</p>
    hit: <p>@Identifier[core:targets]{Target} moves 10 feet away from you.</p>
  skill: true
  standard: true
  trigger: >-
    <p>Moving at least 10 feet in a straight line towards the @Identifier[core:targets]{target} and becoming adjacent to
    them.</p>
