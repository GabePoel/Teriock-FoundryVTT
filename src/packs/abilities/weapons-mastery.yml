  overview:
    base: >-
      <p>Pick a @Wiki[Category:Equipment classes]{class of equipment}. These weapons are
      @Identifier[keyword:armor-voiding]{AV0} for you. You may change which class of weapons you choose during a
      @Identifier[core:long-rest]{long rest}. Whenever you attempt a @Identifier[core:active-maneuvers]{single action}
      @Identifier[core:item-delivery]{weapon} @Identifier[core:attack-interaction]{attack} with a weapon of the chosen
      @Wiki[Category:Weapon classes]{class}, you may trigger a @Identifier[core:active-maneuvers]{single action}
      non-attack @Identifier[power:basic-abilities]{basic ability} as a @Identifier[core:reactive-maneuvers]{free
      reaction} as well.</p>
    proficient: >-
      <p>You may also trigger @Identifier[core:active-maneuvers]{single action} non-attack @Wiki[Category:Assassin class
