img: systems/teriock/src/icons/abilities/take-humanoid-elemental-form.webp
name: Take Humanoid Elemental Form
system:
  delivery: self
  effectTypes:
    - transformation
  form: special
  identifier: take-humanoid-elemental-form
  interaction: manifest
  overview:
    base: >-
      <p>You take on a @Wiki[Category:Humanoid creatures]{humanoid} form. While in this state you have
      @Identifier[body:hand]{hands}, @Identifier[body:foot]{feet}, and a @Identifier[body:mouth]{mouth}. You keep all
      the innate @Pack[teriock.abilities]{abilities} of your
      @Identifier[ability:take-amorphous-elemental-form]{amorphous elemental form}, but lose all innate
      @Pack[teriock.classes]{ranks} that you gain from it.</p>
  powerSources:
    - magical
  range:
    unit: self
  requirements: <p>You are in an @Identifier[ability:take-amorphous-elemental-form]{amorphous elemental form}.</p>
  targets:
    - self
type: ability
