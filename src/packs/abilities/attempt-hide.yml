name: Attempt Hide
system:
  automations:
    - _id: djJtvPmsCICnQ8CS
      preventThreshold: true
      type: override
    - _id: 0b0d1426453abb55
      relation: apply
      status: hidden
      type: status
  basic: true
  delivery: self
  featSaveAttribute: snk
  identifier: attempt-hide
  interaction: feat
  kind: intrinsic
  overview:
    base: >-
      <p>You attempt to become @Identifier[condition:hidden]{hidden}. If the result of your @Identifier[core:sneak]{SNK}
      @Identifier[core:feat-interaction]{save} is greater than the @Identifier[core:perception]{passive perception} (10
      + 2 × @Identifier[core:perception]{PER}) of any creatures that could see you, you become
      @Identifier[condition:hidden]{hidden} from them. The value you rolled is your hidden
      @Identifier[core:difficulty-class]{DC}.</p>
  powerSources:
    - martial
  range:
    unit: self
  requirements: >-
    <p>You are in a location with shadows, dim light, @Identifier[core:cover]{three-quarters cover}, or some other
    feature which the @Identifier[core:game-master]{GM} determines is appropriate for being
    @Identifier[condition:hidden]{hidden}. You must remain in areas that maintain these conditions to stay
    @Identifier[condition:hidden]{hidden}.</p>
  targets:
    - self
type: ability
