_id: 7a8fa06ac4a22c03
_key: "!effects!7a8fa06ac4a22c03"
img: systems/teriock/src/assets/thumbnails/ability/disable-strike.webp
name: Disable Strike
showIcon: 0
system:
  costs:
    primary:
      mp:
        description: >-
          <p>This costs 0 @Identifier[core:hit-points-and-mana-points]{MP} if the triggering
          @Pack[teriock.abilities]{ability} was used on you or some @Pack[teriock.equipment]{equipment} you
          @Identifier[keyword:bearing]{bear}. It costs 1 @Identifier[core:hit-points-and-mana-points]{MP} otherwise.</p>
        type: description
  duration:
    raw: "1"
    unit: minute
  endCondition: >-
    <p>At the end of each of the @Identifier[core:targets]{target's} @Identifier[core:turns]{turns}, they roll [[/roll
    2d4]]. If either of these dice roll a 4, this effect ends.</p>
  executionTime:
    base: r1
  identifier: disable-strike
  maneuver: reactive
  overview:
    proficient: <p>This also makes the effect of that @Pack[teriock.abilities]{ability} @Identifier[core:fizzles]{fizzle}.</p>
  powerSources:
    - spiritual
  requirements: <p>You may only @Identifier[core:targets]{target} the triggering creature.</p>
  results:
    hit: >-
      <p>@Identifier[core:targets]{Target} becomes @Identifier[keyword:incapable]{incapable} of the
      @Pack[teriock.abilities]{ability} they were using.</p>
  trigger: >-
    <p>Another creature uses a non-@Identifier[power:basic-abilities]{basic} @Identifier[core:active-maneuvers]{active}
    or @Identifier[core:reactive-maneuvers]{reactive ability} that isn't a @Wiki[Category:Spells]{spell} against a
    different creature or some @Pack[teriock.equipment]{equipment} that different creature
    @Identifier[keyword:bearing]{bares}.</p>
type: ability
