  kind: special
  overview:
    base: >-
      <p>Your body dissolves into countless tiny @Wiki[Category:Insects]{insects}, giving you
      @Identifier[ability:swarm]{Swarm} for the duration of this effect. The @Wiki[Category:Insects]{insects} that
      compose you are fully functional, coordinated, and under your control. They move as a mass that resembles your
      prior shape and can still @Identifier[keyword:bearing]{bare}, but not @Identifier[keyword:using]{use} items.
      Collectively, the @Wiki[Category:Insects]{insects} retain your prior @Identifier[core:size]{size} and
      @Identifier[core:weight]{weight}. However, they can now move through small physical barriers.</p>
