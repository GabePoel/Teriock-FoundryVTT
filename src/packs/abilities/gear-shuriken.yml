    base: >-
      <p>You shoot a gear out of your body as a sharp spinning disk resembling a
      @Identifier[equipment:shuriken]{shuriken} and launch it at the @Identifier[core:targets]{target}. [[lookup name]]
      counts as a @UUID[Compendium.teriock.tables.RollTable.63e9a3bd88895816]{weapon} in the @Wiki[Category:Specialty
      weapons]{specialty weapon} and @Wiki[Category:Daggers]{dagger weapon classes}. It does not deal
      @Identifier[damage:magic]{magic damage} on its own, but can be made to using @Pack[teriock.abilities]{abilities}
      such as @Identifier[ability:might-strike]{Might Strike}.</p>
    fluent: <p>Instead, deal [[/damage 1d12]] @Identifier[core:damage]{damage} to @Identifier[core:targets]{target}.</p>
