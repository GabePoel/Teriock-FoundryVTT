  interaction: manifest
  maneuver: passive
  overview:
    base: >-
      <p>Having mastered the basic techniques of magic, you are able to cast more advanced
      @Identifier[keyword:spell]{spells}. If you create any @Identifier[core:elder-sorcery]{Elder Sorcery}
      @Identifier[keyword:spell]{spells} of your own, they get added to this list. However, just because you "know" how
      to cast these spells, doesn't mean you are always prepared to. Although all @Identifier[archetype:mage]{mage
      classes} grant their own @Identifier[core:elder-sorcery]{Elder Sorcery} and @Wiki[Category:Rotator spells]{rotator
      spells}, you may only have a maximum of @Identifier[archetype:mage]{MR} - 1 of these spells rotated into your
      spell list at any given time across <i>all</i> classes. @Identifier[archetype:mage]{MR} refers to the number of
      @Identifier[core:leveling-up]{ranks} you have in @Identifier[archetype:mage]{mage classes}. During a
      @Identifier[core:long-rest]{long rest}, you can "rotate" which spells you have prepared.</p>
    fluent: >-
      <p>You may instead prepare 2 × (MR - 1) + @Identifier[core:proficiency-bonus]{P} of these
      @Identifier[keyword:spell]{spells}.</p>
    proficient: <p>You may instead prepare 2 × (MR - 1) of these @Identifier[keyword:spell]{spells}.</p>
  powerSources:
    - martial
  range:
    unit: self
  skill: true
  slug: rotators
  targets:
