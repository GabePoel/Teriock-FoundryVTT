img: systems/teriock/src/assets/thumbnails/ability/constructed-body.webp
name: Constructed Body
system:
  automations:
    - _id: 29b275994cf9f5b1
      formula: 1d10
      type: roll
  delivery: self
  duration:
    unit: unlimited
  executionTime:
    base: passive
  identifier: constructed-body
  interaction: manifest
  maneuver: passive
  overview:
    base: >-
      <p>You count as an @Pack[teriock.equipment]{item} for the purposes of certain
      @Identifier[core:item-target]{abilities that target them}. The relevant @Identifier[core:item-target]{abilities}
      are those would apply one of the following @Pack[teriock.properties]{properties} to a piece of
      @Pack[teriock.equipment]{equipment}. You take the effect listed below instead. If the
      @Identifier[core:item-target]{ability} was @Wiki[Category:Magically powered abilities]{magically powered}, then
      any @Identifier[core:damage]{damage} dealt is @Identifier[damage:magic]{magic} in addition to its other
      @UUID[Compendium.teriock.rules.JournalEntry.damage0000000000]{types}. If the
      @Identifier[core:item-target]{ability} was delivered by a @Identifier[core:item-delivery]{weapon}, then the
      @Identifier[core:damage]{damage} has all the @UUID[Compendium.teriock.rules.JournalEntry.damage0000000000]{damage
      types} that @UUID[Compendium.teriock.tables.RollTable.63e9a3bd88895816]{weapon} would deal in addition to its
      other
      @UUID[Compendium.teriock.rules.JournalEntry.damage0000000000]{types}.</p><ul><li>@Identifier[property:destroyed]{Destroyed}:
      Take [[/damage 1d10]] @Identifier[core:damage]{damage}.</li><li>@Identifier[property:shattered]{Shattered}: Take a
      @Identifier[damage:hack]{hack} of your choice.</li><li>@Identifier[property:warded]{Warded}: The next
      @Identifier[core:self-delivery]{self delivery ability} you use is
      @Identifier[keyword:warded]{warded}.</li></ul><p>For any other passive @Pack[teriock.properties]{properties} that
      the @Pack[teriock.equipment]{equipment} may gain, your @Pack[teriock.bodyParts]{body parts} gain those
      @Pack[teriock.properties]{properties}. Additionally, any @Wiki[Category:AV granting abilities]{natural AV} you may
      have counts as @UUID[Compendium.teriock.tables.RollTable.ed3267c1d2c3a7f4]{armor} for these purposes.</p>
  powerSources:
    - martial
  range:
    unit: self
  targets:
    - self
type: ability
