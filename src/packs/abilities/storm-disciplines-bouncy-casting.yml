  overview:
    base: >-
      <p>You may choose a new @Identifier[core:targets]{target} for the @Identifier[keyword:spell]{spell}. All
      @Identifier[core:attack-interaction]{attack rolls}, @Identifier[core:feat-interaction]{feat saves}, and other dice
      rolls or effects are re-rolled or re-calculated as if the @Identifier[keyword:spell]{spell} was cast on the new
      target. The @Identifier[core:range]{range} of the @Identifier[keyword:spell]{spell} remains unchanged, but is
      calculated from the new @Identifier[core:targets]{target} instead of from you.</p><aside class="notification info
      theme-dark"><p>If the @Identifier[keyword:spell]{spell} was @Identifier[core:heightening]{heightened}, or you
      spent any other @Identifier[core:costs]{costs} on the @Identifier[keyword:spell]{spell}, those remain unchanged
      and do not need to be re-spent.</p></aside>
