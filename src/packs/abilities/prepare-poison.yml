    base: >-
      <p>You spend a @Identifier[core:short-rest]{short rest} preparing a vial of poison for your own uses. Once the
      vial is prepared, you may either apply it to a
      @UUID[Compendium.teriock.tables.RollTable.63e9a3bd88895816]{weapon}, which can then be used for a single
      @Identifier[ability:poison-strike]{Poison Strike}, or get it ready to put on some other item, which can in turn be
      applied with @Identifier[ability:poison-item]{Poison Item}. Once prepared, the poison only lasts 24 hours before
      it expires.</p>
