name: Basic Command
system:
  basic: true
  delivery: sight
  identifier: basic-command
  interaction: manifest
  kind: intrinsic
  overview:
    base: >-
      <p>You issue a command to a @Identifier[core:minions]{minion} that acts at your discretion. It gains 2 actions
      that it can use before the end of your @Identifier[core:turns]{turn}. If you somehow used [[lookup name]] as a
      @Wiki[Category:Free action abilities]{free action} instead of a @Wiki[Category:Single action abilities]{single
      action}, then the minion gains only 1 action instead.</p>
