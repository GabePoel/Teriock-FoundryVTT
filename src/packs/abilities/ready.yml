img: systems/teriock/src/assets/thumbnails/ability/ready.webp
name: Ready
system:
  basic: true
  delivery: self
  duration:
    raw: "5"
    unit: second
  identifier: ready
  interaction: manifest
  kind: intrinsic
  overview:
    base: >-
      <p>You prepare to use an action that will occur outside your turn. Choose a
      @Identifier[core:active-maneuvers]{single action} or @Identifier[core:active-maneuvers]{free action ability} you
      can use, and designate a trigger. Your turn then ends. If the trigger you designated occurs before the start of
      your next turn, you can use the chosen @Identifier[core:active-maneuvers]{ability} as a
      @Identifier[core:reactive-maneuvers]{reaction} (provided you still meet the requirements to use it).</p><p>If you
      have an @Identifier[core:multiple-attacks]{attack penalty} from making multiple
      @Identifier[core:attack-interaction]{attacks} and your readied @Identifier[core:active-maneuvers]{ability} is an
      @Identifier[core:attack-interaction]{attack ability}, your readied @Identifier[core:active-maneuvers]{ability}
      takes the same @Identifier[core:multiple-attacks]{attack penalty} you had at the time you used [[lookup name]].
      This is one of the few times the @Identifier[core:multiple-attacks]{attack penalty} applies when it's not your
      turn.</p>
  powerSources:
    - martial
  range:
    unit: self
  sustained: true
  targets:
    - self
type: ability
