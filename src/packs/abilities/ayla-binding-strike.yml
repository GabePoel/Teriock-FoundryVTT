img: systems/teriock/src/icons/abilities/ayla-binding-strike.webp
name: Ayla Binding Strike
system:
  effectTypes:
    - control
    - disease
  elements:
    - necromancy
  identifier: ayla-binding-strike
  kind: special
  powerSources:
    - primal
    - spiritual
  requirements: <p>@Identifier[core:targets]{Target} is dead.</p>
  results:
    hit: >-
      <p>@Identifier[core:targets]{Target} is infected with a disease that takes 10 minutes to manifest. During this
      time, the disease can be removed with @Identifier[ability:cure-illness]{Cure Illness} and a
      @Identifier[core:difficulty-class]{DC} 15 @Identifier[tradecraft:herbalist]{herbalist} check. Afterwards, it can
      only be removed with effects akin to @Identifier[ability:exorcism]{Exorcism}. Once the disease is manifested, the
      @Identifier[core:targets]{target's} spirit must follow directions you provide to it. You do not need to share any
      language with the @Identifier[core:targets]{target} or their spirit. This is more akin to a "hive mind", where
      they implicitly understand you needs and directives.</p>
type: ability
