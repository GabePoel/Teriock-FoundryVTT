  overview:
    base: >-
      <p>While @Identifier[condition:dueling]{dueling} or in a staged battle (gladiator fights, ceremonial battles,
      etc.) you gain an extra @Identifier[core:hit-points-and-mana-points]{warrior hit die} (+7 HP, [[/roll 1d12]]).
      When you gain the @Identifier[core:hit-points-and-mana-points]{hit die}, you may pay 1
      @Identifier[core:hit-points-and-mana-points]{MP} to immediately @Identifier[core:healing]{heal} with it without
      consuming it. Additionally, any allies @Identifier[condition:dueling]{dueled} with you or with you in a staged
      fight may pay 1 @Identifier[core:hit-points-and-mana-points]{MP} at the beginning of the fight to gain
      @Identifier[ability:hack]{Hack} for that fight. @Wiki[Category:Gladiator fighting style weapons]{Weapons you use
      with the gladiator fighting style} are @Identifier[property:armor-voiding]{AV0} as well.</p>
  powerSources:
    - martial
  range:
    unit: self
  requirements: <p>You are @Identifier[condition:dueling]{dueling} or in a staged battle.</p>
  skill: true
  standard: true
  targets:
    - self
type: ability
