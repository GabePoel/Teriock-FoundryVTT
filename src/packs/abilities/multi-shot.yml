img: systems/teriock/src/icons/abilities/multi-shot.webp
name: Multi-Shot
system:
  delivery: self
  duration:
    unit: unlimited
  executionTime:
    base: passive
  identifier: multi-shot
  interaction: manifest
  maneuver: passive
  overview:
    base: >-
      <p>When you @Identifier[core:attack-interaction]{attack} with a @Identifier[property:ranged]{ranged weapons}, you
      may @Identifier[core:attack-interaction]{attack} up to 2 additional @Identifier[core:targets]{targets} as well.
      You must have enough @Identifier[property:ammunition]{ammunition} or @Identifier[property:thrown]{thrown} weapons
      to make these additional @Identifier[core:attack-interaction]{attacks}. These all share the same
      @Identifier[core:multiple-attacks]{attack penalty} although you roll for the
      @Identifier[core:attack-interaction]{attacks} against each @Identifier[core:targets]{target} separately. Only the
      original @Identifier[core:attack-interaction]{attack} incurs additional attack penalties.</p>
  powerSources:
    - martial
  range:
    unit: self
  skill: true
  standard: true
  targets:
    - self
