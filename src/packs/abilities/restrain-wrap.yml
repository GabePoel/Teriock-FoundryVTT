img: systems/teriock/src/assets/thumbnails/ability/restrain-wrap.webp
name: Restrain Wrap
showIcon: 0
system:
  costs:
    components:
      material:
        description: >-
          <p>The item you're @Identifier[core:deliveries]{delivering} this with. The item is not consumed, but is
          instead wrapped around the @Identifier[core:targets]{target}. The item cannot be
          @Identifier[keyword:using]{used} while it is restraining the @Identifier[core:targets]{target}.</p>
        type: description
  duration:
    raw: "1"
    unit: hour
  endCondition: >-
    <p>The item that @Identifier[core:deliveries]{delivered} this is removed. This can be done by someone who isn't
    restrained @Identifier[ability:interact]{interacting} with it as a @Identifier[core:active-maneuvers]{triple
    action}.</p>
  executionTime:
    base: a3
  identifier: restrain-wrap
  powerSources:
    - spiritual
  results:
    hit: >-
      <p>@Identifier[core:targets]{Target} is @Identifier[condition:silenced]{silenced} and
      @Identifier[condition:paralyzed]{paralyzed}.</p>
type: ability
