      @UUID[Compendium.teriock.tables.RollTable.63e9a3bd88895816]{weapon} in the @Wiki[Category:Specialty
      weapons]{specialty weapon} and @Wiki[Category:Daggers]{dagger weapon classes}. It does not deal
      @Identifier[damage:magic]{magic damage} @Identifier[core:damage]{damage} on its own, but can be made to using
      @Pack[teriock.abilities]{abilities} such as @Identifier[ability:might-strike]{Might Strike}.</p>
