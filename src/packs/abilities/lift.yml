name: Lift
showIcon: 0
system:
  automations:
    - _id: JyKUVceeI0c6RGso
      attribute: snk
      type: feat
  delivery: hand
  featSaveAttribute: per
  interaction: feat
  overview:
    base: >-
      <p>You attempt to place a single piece of @Pack[teriock.equipment]{equipment} onto the
      @Identifier[core:targets]{target} without them noticing. If the @Pack[teriock.equipment]{equipment} is not
      @Identifier[property:small]{small} or @Identifier[property:searchable]{searchable}, the
      @Identifier[core:targets]{target} makes their @Identifier[core:perception]{PER}
      @Identifier[core:feat-interaction]{save} with a @Identifier[core:boons-and-banes]{boon}.</p>
  powerSources:
    - martial
  results:
    critSave: >-
      <p>You fail to place the @Pack[teriock.equipment]{equipment} onto the @Identifier[core:targets]{target} and they
      catch you in the act.</p>
    fail: >-
      <p>You place the @Pack[teriock.equipment]{equipment} onto the @Identifier[core:targets]{target} without them
      noticing.</p>
    save: >-
      <p>You do not place the @Pack[teriock.equipment]{equipment} onto the @Identifier[core:targets]{target}. Make a
      @Identifier[core:sneak]{SNK} @Identifier[core:feat-interaction]{save} with the value of the
      @Identifier[core:targets]{target's} @Identifier[core:perception]{PER} @Identifier[core:feat-interaction]{save} as
      the @Identifier[core:difficulty-class]{DC}. If you succeed, they do not notice what you were attempting.</p>
  slug: lift
type: ability
