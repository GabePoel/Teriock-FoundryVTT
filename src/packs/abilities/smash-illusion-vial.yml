  overview:
    base: >-
      <p>All @Pack[teriock.creatures]{creatures} and @Pack[teriock.equipment]{objects} within the area of effect are
      @Identifier[condition:hidden]{hidden} with a hidden @Identifier[core:difficulty-class]{DC} of 10 +
      @Identifier[core:presence]{UNP} (your @Identifier[core:presence]{UNP}, not theirs). This is a
      @Identifier[keyword:illusionary]{minor illusion}. If a creature successfully
      @Identifier[ability:disbelieve]{Disbelieves} it, then they can see everything that was
      @Identifier[condition:hidden]{hidden} in this area. Creatures that become @Identifier[condition:hidden]{hidden} by
      this effect can move freely within the area and remain @Identifier[condition:hidden]{hidden} as long as they do
      not leave the area. If they leave the area, they are no longer @Identifier[condition:hidden]{hidden} and they do
      not become @Identifier[condition:hidden]{hidden} if they re-enter it. At the start of each of each
      @Identifier[core:rounds]{round}, the @Identifier[core:game-master]{GM} rolls [[/roll 1d100]]. On a 75 or higher,
      some unexpected additional random @Identifier[keyword:illusionary]{illusion} occurs in the area as determined by
      the @Identifier[core:game-master]{GM}.</p>
  powerSources:
    - alchemical
  requirements: >-
    <p>Use [[lookup name]] by interacting with the @Pack[teriock.equipment]{equipment} that provides it. That counts as
    the @Identifier[core:maneuvers]{maneuver} and @Identifier[core:abilities]{execution time} for the ability.</p>
  targets:
    - area
    - creature
    - item
type: ability
