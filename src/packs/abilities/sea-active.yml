name: Sea Active
system:
  automations:
    - _id: 4zgoh7K1YsUFtRvr
      activeQualifier: or(@terrain.coastal, @terrain.ocean)
      changes:
        - applyIfSuppressed: false
          key: system.attributes.mov.score
          phase: derived
          target: Actor
          type: add
          value: "1"
      type: changes
    - _id: eJVmqZpmelVnzgW1
      activeQualifier: not(or(@terrain.coastal, @terrain.ocean))
      changes:
        - applyIfSuppressed: false
          key: system.attributes.mov.score
          phase: derived
          target: Actor
          type: subtract
          value: "1"
      type: changes
  delivery: self
  duration:
    unit: unlimited
  executionTime:
    base: passive
  identifier: sea-active
  interaction: manifest
  kind: flaw
  maneuver: passive
  overview:
    base: >-
      <p>While not at sea or on the coast of one, your @Identifier[core:movement]{MOV} score is increased by 1.
      Otherwise, it is decreased by 1.</p>
  powerSources:
    - martial
  range:
    unit: self
  targets:
    - self
