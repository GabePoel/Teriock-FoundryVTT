      area must make a @Identifier[core:strength]{STR} @Identifier[core:feat-interaction]{feat save} or become
      @Identifier[condition:snared]{snared}. At the start of each of the @Identifier[core:targets]{target's}
      @Identifier[core:turns]{turns}, they roll [[/roll 2d4]]. If either of these dice roll a 4, this effect ends. In
      addition, any creature @Identifier[core:movement]{moving} through this area takes [[/damage 1d4[vine]]]
      @Identifier[core:damage]{damage} for every 5 feet they move through it.</p>
