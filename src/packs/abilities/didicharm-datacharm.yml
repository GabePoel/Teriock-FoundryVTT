  overview:
    base: >-
      <p>You chant rhythmic sounds such as "didichum datachum" in unison with other @Wiki[Category:Crabs]{crabs}. The
      chant is mesmerizing and all-consuming to the point that it is the only thing @Identifier[core:targets]{target}
      creature can hear. The @Identifier[core:difficulty-class]{DC} of this is equal to 3 × @Identifier[core:mobs]{M}
      where @Identifier[core:mobs]{M} is the number of @Identifier[core:executor]{executors} taking part in it. This is
      used collectively by all participants of the @Identifier[core:mobs]{mob}, not once per member.</p>
  powerSources:
    - spiritual
  range:
    raw: "120"
    unit: ft
  requirements: >-
    <p>You are in a @Identifier[core:mobs]{mob} of @Wiki[Category:Crabs]{crabs} with at least 3 participants. You are
    not @Identifier[condition:mute]{mute}. @Identifier[core:targets]{Target} is not @Identifier[condition:deaf]{deaf}
    from something other than this effect.</p>
  results:
    fail: >-
      <p>@Identifier[core:targets]{Target} is @Identifier[condition:charmed]{charmed} and
      @Identifier[condition:deaf]{deaf}. While @Identifier[condition:charmed]{charmed}, the
      @Identifier[core:targets]{target} will not willingly move out of @Identifier[core:range]{range}.</p>
    save: <p>@Identifier[core:targets]{Target} is @Identifier[condition:deaf]{deaf}.</p>
