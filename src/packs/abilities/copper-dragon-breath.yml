    primary:
      mp:
        formula: "1"
        type: formula
  delivery: cone
  effectTypes:
    - displacement
    - longRange
    - stealing
  form: special
  heightened: >-
    <p>For each additional @Identifier[core:hit-points-and-mana-points]{MP} spent, deal an additional [[/damage
    2d10[magic]]] @Identifier[core:damage]{damage}. The maximum distance you can transport
    @Pack[teriock.equipment]{items} to is increased by 1 mile. Additionally, the @Identifier[core:range]{range} of this
    increases by 5 feet.</p>
  identifier: copper-dragon-breath
  interaction: feat
  powerSources:
    - magical
  range:
    raw: "30"
    unit: ft
  results:
    fail: >-
      <p>All @Pack[teriock.equipment]{items} @Identifier[core:targets]{targeted} and @Identifier[keyword:bearing]{bared}
      by @Identifier[core:targets]{targets} are stolen and instantly transported to a location of your choosing within 1
      mile.</p>
    save: >-
      <p>Only the @Identifier[property:magic]{magic} @Pack[teriock.equipment]{items} that are not being
      @Identifier[keyword:using]{used} are stolen and transported. Target takes half as much
      @Identifier[core:damage]{damage} from this as they would otherwise. This is calculated after any
      @Identifier[keyword:boosted]{boosts} or @Identifier[keyword:deboosted]{deboosts}.</p>
