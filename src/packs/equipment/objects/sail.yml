    description: >-
      <p>An item that's <b>[[lookup name style=lc]]</b> is easily broken. It becomes
      @Identifier[property:shattered]{shattered} if it is used to @Identifier[core:block-interaction]{block} or if it is
      the @Identifier[core:item-target]{target of an ability} that deals it @Identifier[core:damage]{damage}. If it
      would become @Identifier[property:shattered]{shattered} through some other means, it is instead
      @Identifier[property:destroyed]{destroyed}.</p>
    img: systems/teriock/src/assets/thumbnails/property/fragile.webp
